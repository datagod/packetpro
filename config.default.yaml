# PacketPro defaults (safe to commit — no folder paths here).
# Folder locations are configured via the web UI and stored in:
#   ~/.config/packetpro/config.yaml

enhance:
  enabled: false
  denoise: true
  clahe: true
  adaptive_threshold: true
  deskew: true
  upscale_min_side: 1200
  upscale_factor: 2.0
  pdf_dpi: 200

ocr:
  engine: ollama
  ollama_url: http://127.0.0.1:11434
  model: qwen2.5vl:7b
  paddle_lang: en
  paddle_use_gpu: true
  paddle_gpu_id: 1
  use_both_gpus: false
  secondary_ollama_url: http://127.0.0.1:11435
  secondary_model: qwen2.5vl:7b
  prompt: >-
    Extract all visible text from this image verbatim.
    Preserve line breaks and paragraph structure.
    Output only the extracted text with no commentary.
  timeout_seconds: 300
  max_retries: 3
  num_ctx: 32768

web:
  host: 127.0.0.1
  port: 8787

watcher:
  settle_seconds: 1.0
  poll_interval: 0.5