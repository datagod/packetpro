# Second Ollama instance for PacketPro dual-GPU OCR (GPU0).
# Copy/adapt into your Docker setup, e.g. /docker/ollama-gpu0/docker-compose.yml
#
#   docker compose up -d
#
# Then enable "Use both GPUs" in PacketPro Settings and restart packetpro-ocr.

services:
  ollama-gpu0:
    image: ollama/ollama:latest
    container_name: ollama-gpu0
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - /storage/ollama:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=10m
      - NVIDIA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks:
      - ai-network

networks:
  ai-network:
    external: true